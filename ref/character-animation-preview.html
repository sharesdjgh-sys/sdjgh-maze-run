<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 움직임 미리보기</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../src/styles/character-animation.css"><style>body{margin:0;padding:28px;color:#35513c;background:#e8ebdc;font-family:"Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 18px}nav{display:flex;gap:10px;margin-bottom:20px}button{padding:10px 22px;border:1px solid #849879;border-radius:8px;background:#fff9e9;color:#35513c;cursor:pointer}button[aria-pressed=true]{background:#355b3f;color:#fff5d7}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}article{background:#fff9e9;border:1px solid #d7dcc7;border-radius:14px;text-align:center;padding:10px}.char-animation{width:150px;height:150px}h2{font-size:15px;margin:4px 0 6px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:16px}.char-animation{width:130px;height:130px}}</style><main><h1>캐릭터 움직임 미리보기</h1><p>16종 각각 대기 4프레임 · 걷기 4프레임</p><nav><button data-state="idle" aria-pressed="true">대기 · 눈 깜빡임</button><button data-state="walk" aria-pressed="false">걷기</button></nav><section class="grid"><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="고양이"><img class="character-atlas" src="../src/assets/animations/cat.webp" alt="" /></span><h2>고양이</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="사막여우"><img class="character-atlas" src="../src/assets/animations/fennec.webp" alt="" /></span><h2>사막여우</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="앵무새"><img class="character-atlas" src="../src/assets/animations/parrot.webp" alt="" /></span><h2>앵무새</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="강아지"><img class="character-atlas" src="../src/assets/animations/dog.webp" alt="" /></span><h2>강아지</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="토끼"><img class="character-atlas" src="../src/assets/animations/rabbit.webp" alt="" /></span><h2>토끼</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="펭귄"><img class="character-atlas" src="../src/assets/animations/penguin.webp" alt="" /></span><h2>펭귄</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="쿼카"><img class="character-atlas" src="../src/assets/animations/quokka.webp" alt="" /></span><h2>쿼카</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="허스키"><img class="character-atlas" src="../src/assets/animations/husky.webp" alt="" /></span><h2>허스키</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="너구리"><img class="character-atlas" src="../src/assets/animations/raccoon.webp" alt="" /></span><h2>너구리</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="비버"><img class="character-atlas" src="../src/assets/animations/beaver.webp" alt="" /></span><h2>비버</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="수달"><img class="character-atlas" src="../src/assets/animations/otter.webp" alt="" /></span><h2>수달</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="곰"><img class="character-atlas" src="../src/assets/animations/bear.webp" alt="" /></span><h2>곰</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="여우"><img class="character-atlas" src="../src/assets/animations/fox.webp" alt="" /></span><h2>여우</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="부엉이"><img class="character-atlas" src="../src/assets/animations/owl.webp" alt="" /></span><h2>부엉이</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="카멜레온"><img class="character-atlas" src="../src/assets/animations/chameleon.webp" alt="" /></span><h2>카멜레온</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="아기 사슴"><img class="character-atlas" src="../src/assets/animations/deer.webp" alt="" /></span><h2>아기 사슴</h2></article></section></main><script>document.querySelectorAll("button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-motion]").forEach(sprite=>sprite.dataset.motion=button.dataset.state);document.querySelectorAll("button").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));});</script></html>
