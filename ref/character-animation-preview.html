<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 움직임 미리보기</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../src/styles/character-animation.css"><style>body{margin:0;padding:28px;color:#35513c;background:#e8ebdc;font-family:"Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 18px}nav{display:flex;gap:10px;margin-bottom:20px}button{padding:10px 22px;border:1px solid #849879;border-radius:8px;background:#fff9e9;color:#35513c;cursor:pointer}button[aria-pressed=true]{background:#355b3f;color:#fff5d7}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}article{background:#fff9e9;border:1px solid #d7dcc7;border-radius:14px;text-align:center;padding:10px}.char-animation{width:150px;height:150px}h2{font-size:15px;margin:4px 0 6px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:16px}.char-animation{width:130px;height:130px}}</style><main><h1>캐릭터 움직임 미리보기</h1><p>16종 각각 대기 4프레임 · 걷기 4프레임</p><nav><button data-state="idle" aria-pressed="true">대기 · 눈 깜빡임</button><button data-state="walk" aria-pressed="false">걷기</button></nav><section class="grid"><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="멜로"><img class="character-atlas" src="../src/assets/animations/cat.webp" alt="" /></span><h2>멜로</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="소리"><img class="character-atlas" src="../src/assets/animations/fennec.webp" alt="" /></span><h2>소리</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="리프"><img class="character-atlas" src="../src/assets/animations/parrot.webp" alt="" /></span><h2>리프</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="토크"><img class="character-atlas" src="../src/assets/animations/dog.webp" alt="" /></span><h2>토크</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="바니"><img class="character-atlas" src="../src/assets/animations/rabbit.webp" alt="" /></span><h2>바니</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="페이스"><img class="character-atlas" src="../src/assets/animations/penguin.webp" alt="" /></span><h2>페이스</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="스킵"><img class="character-atlas" src="../src/assets/animations/quokka.webp" alt="" /></span><h2>스킵</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="루카"><img class="character-atlas" src="../src/assets/animations/husky.webp" alt="" /></span><h2>루카</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="몽"><img class="character-atlas" src="../src/assets/animations/raccoon.webp" alt="" /></span><h2>몽</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="토리"><img class="character-atlas" src="../src/assets/animations/beaver.webp" alt="" /></span><h2>토리</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="조이"><img class="character-atlas" src="../src/assets/animations/otter.webp" alt="" /></span><h2>조이</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="블록"><img class="character-atlas" src="../src/assets/animations/bear.webp" alt="" /></span><h2>블록</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="모아"><img class="character-atlas" src="../src/assets/animations/fox.webp" alt="" /></span><h2>모아</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="루미"><img class="character-atlas" src="../src/assets/animations/owl.webp" alt="" /></span><h2>루미</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="피코"><img class="character-atlas" src="../src/assets/animations/chameleon.webp" alt="" /></span><h2>피코</h2></article><article><span class="char-animation" data-animation-ready="true" data-motion="idle" role="img" aria-label="루트"><img class="character-atlas" src="../src/assets/animations/deer.webp" alt="" /></span><h2>루트</h2></article></section></main><script>document.querySelectorAll("button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-motion]").forEach(sprite=>sprite.dataset.motion=button.dataset.state);document.querySelectorAll("button").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));});</script></html>
